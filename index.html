
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAGEON AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <header>
      <h2>SAGEON <span>AI</span></h2>
      <p>● SYSTEM ONLINE</p>
    </header>

    <main>
      <div class="orb">S</div>

      <h1>WELCOME, MASTER.</h1>
      <p>Your intelligent personal assistant.</p>

      <div class="chat-box" id="chatBox">
        <div class="message bot">
          Greetings, Master. How may I assist you?
        </div>
      </div>

      <div class="input-area">
        <input id="userInput" placeholder="Ask SAGEON anything...">
        <button id="sendBtn">SEND</button>
        <button id="micBtn">🎙️</button>
      </div>
    </main>

    <footer>SAGEON AI © 2026</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
